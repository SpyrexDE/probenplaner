<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    SetEnvIf Host "^.*$" APP_ENV=${APP_ENV}
    SetEnvIf Host "^.*$" GIT_VERSION=${GIT_VERSION}
    
    # Force HTTPS for test and prod environments
        # Only redirect if not already behind a reverse proxy handling HTTPS
    RewriteEngine On
    RewriteCond %{ENV:APP_ENV} ^(test|production)$
    RewriteCond %{HTTPS} off
    RewriteCond %{HTTP:X-Forwarded-Proto} !https
    RewriteCond %{HTTP:X-Forwarded-Ssl} !on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # CalDAV endpoint: own entry-point, skip main .htaccess rewrite
    <Directory /var/www/html/public/caldav>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Allow all CalDAV/WebDAV HTTP methods
        <LimitExcept OPTIONS GET POST PUT DELETE PROPFIND PROPPATCH MKCALENDAR REPORT>
            Require all denied
        </LimitExcept>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # JOinJMD passes the Keycloak access token as ?jmd_accesstoken=: log those requests without the query
    SetEnvIfExpr "%{QUERY_STRING} =~ /accesstoken/" jmd_token_request
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined_noquery
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!jmd_token_request
    CustomLog ${APACHE_LOG_DIR}/access.log combined_noquery env=jmd_token_request
</VirtualHost>