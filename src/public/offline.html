<!DOCTYPE html>
<html lang="de" class="w-full h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Offline - Probenplaner</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #478cf4 0%, #3a7bd5 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .offline-icon {
            font-size: 4rem;
            color: #478cf4;
            margin-bottom: 24px;
        }
        
        .offline-title {
            font-size: 2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }
        
        .offline-message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 1.1rem;
        }
        
        .offline-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .offline-button {
            background: #478cf4;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        
        .offline-button:hover {
            background: #3a7bd5;
            transform: translateY(-1px);
        }
        
        .offline-button.secondary {
            background: transparent;
            color: #478cf4;
            border: 2px solid #478cf4;
        }
        
        .offline-button.secondary:hover {
            background: #478cf4;
            color: white;
        }
        
        .connection-status {
            margin-top: 24px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .connection-status.online {
            background: #d1fae5;
            color: #065f46;
        }
        
        .connection-status.offline {
            background: #fee2e2;
            color: #7f1d1d;
        }
        
        @media (max-width: 480px) {
            .offline-container {
                padding: 24px;
            }
            
            .offline-title {
                font-size: 1.5rem;
            }
            
            .offline-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">Keine Internetverbindung</h1>
        <p class="offline-message">
            Du bist momentan offline. Der Probenplaner benötigt eine Internetverbindung, 
            um die neuesten Informationen zu laden.
        </p>
        
        <div class="offline-actions">
            <button class="offline-button" onclick="window.location.reload()">
                🔄 Erneut versuchen
            </button>
            <button class="offline-button secondary" onclick="checkOfflineFeatures()">
                📱 Offline-Funktionen
            </button>
        </div>
        
        <div id="connection-status" class="connection-status offline">
            ⚫ Offline - Keine Verbindung zum Server
        </div>
    </div>

    <script>
        // Check online status
        function updateConnectionStatus() {
            const statusElement = document.getElementById('connection-status');
            
            if (navigator.onLine) {
                statusElement.textContent = '🟢 Online - Verbindung wiederhergestellt';
                statusElement.className = 'connection-status online';
                
                // Auto-reload after 2 seconds when back online
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } else {
                statusElement.textContent = '⚫ Offline - Keine Verbindung zum Server';
                statusElement.className = 'connection-status offline';
            }
        }
        
        // Listen for online/offline events
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        
        // Check status on load
        updateConnectionStatus();
        
        // Check connection every 10 seconds
        setInterval(updateConnectionStatus, 10000);
        
        // Show information about offline features
        function checkOfflineFeatures() {
            alert('Offline-Funktionen:\n\n' +
                  '• Diese Seite wurde für den Offline-Zugriff gecacht\n' +
                  '• Grundlegende App-Struktur ist verfügbar\n' +
                  '• Aktuelle Proben-Daten benötigen eine Internetverbindung\n\n' +
                  'Sobald du wieder online bist, werden alle Funktionen verfügbar sein.');
        }
        
        // Try to reconnect periodically
        function tryReconnect() {
            fetch('/', { 
                method: 'HEAD',
                cache: 'no-cache'
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/';
                }
            })
            .catch(() => {
                // Still offline, try again later
                setTimeout(tryReconnect, 30000);
            });
        }
        
        // Start reconnection attempts
        setTimeout(tryReconnect, 10000);
    </script>
</body>
</html>
